name: Analytics pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "reports/figures/**"
      - "reports/tables/**"
      - "reports/analysis_report.md"
      - "reports/validation_report.md"
  pull_request:

permissions:
  contents: write

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m scripts.run_all
      - name: Publish reproducible figures and reports
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/figures reports/tables reports/analysis_report.md reports/validation_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh computed charts and report [skip ci]"
            git push origin HEAD:main
          fi
